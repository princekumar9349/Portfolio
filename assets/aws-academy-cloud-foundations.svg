<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <radialGradient id="innerGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(255, 153, 0, 0.22)"/>
      <stop offset="60%" stop-color="rgba(255, 153, 0, 0.03)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ff9900" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- Outer Shield Frame -->
    <polygon points="120,8 222,44 222,154 120,230 18,154 18,44" 
             fill="url(#shieldRim)" 
             stroke="#fbbf24" 
             stroke-width="1.5"/>

    <!-- Inner Shield Body -->
    <polygon points="120,14 214,48 214,150 120,222 26,150 26,48" 
             fill="url(#shieldBg)"/>

    <!-- Inner Shield Glow Overlay -->
    <polygon points="120,14 214,48 214,150 120,222 26,150 26,48" 
             fill="url(#innerGlow)"/>

    <!-- Inner Decorative Border -->
    <polygon points="120,22 204,52 204,146 120,212 36,146 36,52" 
             fill="none" 
             stroke="rgba(255, 255, 255, 0.12)" 
             stroke-width="1.5" 
             stroke-dasharray="4,2"/>
  </g>

  <!-- AWS Wordmark & Smile Arrow -->
  <g transform="translate(120, 68) scale(1.15)">
    <!-- "aws" text -->
    <path d="M-36,0 C-36,-9 -30,-14 -22,-14 C-15,-14 -10,-10 -9,-5 L-9,-13 L-3,-13 L-3,0 L-9,0 L-9,-3 C-10,0 -15,1 -20,1 C-29,1 -36,-3 -36,0 Z" fill="#ffffff" opacity="0"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="1">
      aws
    </text>
    <!-- AWS Smile Arrow -->
    <path d="M-26,5 Q0,16 26,5" fill="none" stroke="#ff9900" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M26,5 L22,-0 M26,5 L19,6" fill="none" stroke="#ff9900" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- "Academy" Text -->
  <text x="120" y="104" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14.5" fill="#e2e8f0" letter-spacing="3.5">
    ACADEMY
  </text>

  <!-- "GRADUATE" Banner -->
  <g transform="translate(120, 130)">
    <!-- Ribbon Box -->
    <rect x="-68" y="-12" width="136" height="24" rx="4" fill="url(#ribbonGrad)"/>
    <!-- Ribbon Text -->
    <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="11.5" fill="#ffffff" letter-spacing="2">
      ★ GRADUATE ★
    </text>
  </g>

  <!-- Course Title -->
  <text x="120" y="168" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" fill="#ffffff">
    Cloud Foundations
  </text>
  <text x="120" y="186" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" letter-spacing="1.5">
    TRAINING &amp; CERTIFICATION
  </text>

  <!-- Small Verification Check in Shield Tip -->
  <circle cx="120" cy="208" r="6.5" fill="#ff9900"/>
  <polyline points="117,208 119.5,210.5 123.5,206" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
